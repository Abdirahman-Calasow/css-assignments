<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Section</title>
    <style>
        .feature-section {
          
            background-color: #1e293b;

         
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                              url('https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?auto=format&fit=crop&w=1200&q=80');

          
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            
            color: #ffffff;
            text-align: center;
            padding: 80px 20px;
            border-radius: 12px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .feature-section h2 {
            font-size: 2.5rem;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .feature-section p {
            font-size: 1.25rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.5;
        }
    </style>
</head>
<body>

   
    <div class="feature-section">
        <h2>Special Offer</h2>
        <p>Don't miss out on our exclusive deal available this week only!</p>
    </div>

</body>
</html>
