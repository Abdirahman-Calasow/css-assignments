  <title>Mixed Box Model Challenge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation Bar using border-box -->

    <button class="nav-btn">Home</button>

    <img src="https://images.unsplash.com/photo-1722239444842-9fe13766c914?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8Ym95c3xlbnwwfHwwfHx8MA%3D%3D" alt="Gallery Image 3" class="gallery-img img-3">

</html>
