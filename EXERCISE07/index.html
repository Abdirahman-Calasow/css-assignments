<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
.text-block {
  margin-bottom: 20px;
  background-color: #f4f4f9;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  color: #333;
}


#block1 {
  padding: 40px;
}


#block2 {
  padding: 5px;
}


#block3 {
  padding: 20px 24px;
}
    </style>
</head>
<body>
    <div class="text-block" id="block1">Text Block 1 - Notice the spacious layout inside.</div>
<div class="text-block" id="block2">Text Block 2 - A more snug appearance.</div>
<div class="text-block" id="block3">Text Block 3 - Perfect for reading with balanced spacing.</div>

    
</body>
</html>
