<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Styling a Quote Exercise</title>
  <style>
   
    blockquote {
      font-family: 'Georgia', serif;
      font-size: 20px;
      font-style: italic;
    }

  
    blockquote footer {
      font-family: 'Arial', sans-serif;
      font-size: 14px;
      font-weight: bold;
      font-style: normal; 
    }
  </style>
</head>
<body>

  <blockquote>
    "The only way to do great work is to love what you do."
    <footer>— cabdiraxman calasow</footer>
  </blockquote>

</body>
</html>
